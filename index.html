<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 批量转 EPUB</title>
<style>
:root{color-scheme:light dark}
body{font:16px/1.6 system-ui,sans-serif;max-width:850px;margin:25px auto;padding:0 16px}
h1{font-size:1.7em}
section{border:1px solid #8886;border-radius:14px;padding:16px;margin:16px 0}
input[type=text],input[type=file]{width:100%;box-sizing:border-box;padding:10px;margin:6px 0}
button{padding:9px 14px;margin:4px;border:1px solid #8888;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.primary{background:#315bd6;color:white;border:0}
.file{padding:10px 0;border-bottom:1px solid #8884;overflow-wrap:anywhere}
.file button{padding:4px 9px}
.muted{opacity:.75;font-size:.9em}
label{display:block;margin:12px 0}
progress{width:100%}
#log{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}
</style>
</head>
<body>
<h1>非图片PDF批量转EPUB</h1>
<p class="muted">批量提取 PDF 文字、合并正文、识别章节并生成 EPUB 目录。文件在浏览器本地处理。</p>

<section>
<h2>1. 选择 PDF</h2>
<input id="files" type="file" accept=".pdf,application/pdf" multiple>
<div id="fileList">尚未选择文件</div>
<p class="muted">可以调整文件顺序。扫描图片型 PDF 不支持 OCR。</p>
</section>

<section>
<h2>2. 书籍设置</h2>
<label>书名<input id="title" type="text" placeholder="输入书名"></label>
<label>作者<input id="author" type="text" placeholder="未知作者"></label>
<label><input id="keepFiles" type="checkbox" checked> 每份 PDF 保留独立章节</label>
<label><input id="detect" type="checkbox" checked> 自动识别章节标题并生成目录</label>
<label><input id="clean" type="checkbox" checked> 清理中文多余空格和英文断词</label>
<label><input id="lineBreaks" type="checkbox"> 分行（保留 PDF 提取的原始文字行）</label>
<button id="start" class="primary" disabled>开始转换并下载 EPUB</button>
</section>

<section>
<h2>3. 转换进度</h2>
<progress id="progress" value="0" max="100"></progress>
<p id="status">等待选择文件</p>
<pre id="log">转换结果会显示在这里。</pre>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
let files = [];
let lastAutoTitle = "";
let titleManuallyEdited = false;
let coverFound = false;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function say(message) {
  $("log").textContent = message;
}

function status(message) {
  $("status").textContent = message;
}

function progress(value) {
  $("progress").value = value;
}

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderFiles() {
  const box = $("fileList");
  box.replaceChildren();

  if (!files.length) {
    box.textContent = "尚未选择文件";
    $("start").disabled = true;
    return;
  }

  files.forEach((file, i) => {
    const row = document.createElement("div");
    row.className = "file";

    const name = document.createElement("span");
    name.textContent =
      `${i + 1}. ${file.name} (${(file.size / 1048576).toFixed(2)} MB) `;
    row.appendChild(name);

    for (const [label, delta] of [
      ["上移", -1],
      ["下移", 1],
      ["删除", 0]
    ]) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.disabled =
        (delta === -1 && i === 0) ||
        (delta === 1 && i === files.length - 1);

      button.onclick = () => {
        if (label === "删除") {
          files.splice(i, 1);
        } else {
          const target = i + delta;
          [files[i], files[target]] = [files[target], files[i]];
        }
        renderFiles();
      };

      row.appendChild(button);
    }

    box.appendChild(row);
  });

  $("start").disabled = false;
}

$("title").addEventListener("input", () => {
  titleManuallyEdited =
    $("title").value.trim() !== lastAutoTitle;
});

$("files").addEventListener("change", event => {
  files = Array.from(event.target.files || []);

  if (files.length) {
    const titleInput = $("title");
    const currentTitle = titleInput.value.trim();

    const shouldAutoUpdate =
      !currentTitle ||
      (!titleManuallyEdited && currentTitle === lastAutoTitle);

    if (shouldAutoUpdate) {
      lastAutoTitle = files[0].name.replace(/\.pdf$/i, "");
      titleInput.value = lastAutoTitle;
      titleManuallyEdited = false;
    }
  }

  renderFiles();

  say(
    files.length
      ? "文件已载入，可以开始转换。"
      : "请选择 PDF。"
  );
});

function isStarLine(s) {
  return /^\*+$/.test(String(s || "").trim());
}

function isSoundLine(s) {
  return /^[\u3400-\u9fff]{1,8}[—–\-…]+$/.test(
    String(s || "").trim()
  );
}

function removeAsposeWatermark(s) {
  return String(s || "")
    .replace(
      /Evaluation\s+Only\.?\s*Created\s+with\s+Aspose\.PDF\.?\s*Copyright\s+2002\s*[-–—]\s*2026\s+Aspose\s+Pty\s+Ltd\.?/gi,
      ""
    )
    .replace(
      /Evaluation\s+Only\.?\s*Created\s+with\s+Aspose\.PDF\.?/gi,
      ""
    )
    .replace(
      /Copyright\s+2002\s*[-–—]\s*2026\s+Aspose\s+Pty\s+Ltd\.?/gi,
      ""
    );
}

function normalizeText(s) {
  let result = String(s || "").trim();

  if ($("clean").checked) {
    result = result
      .replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+(?=[\u3400-\u9fff\uf900-\ufaff])/g,
        "$1"
      )
      .replace(/([，。！？；：、])[ \t]+/g, "$1")
      .replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+([，。！？；：、）》】」』〕〉％…])/g,
        "$1$2"
      )
      .replace(/([（【「『〔〈])[ \t]+/g, "$1")
      .replace(/[ \t]+([）】」』〕〉])/g, "$1");
  }

  return result.trim();
}

function cleanText(s) {
  if (!s) return "";

  s = removeAsposeWatermark(String(s)
    .replace(/\u00a0/g, " ")
    .replace(/\r\n?/g, "\n")
    .replace(/([A-Za-z])-[ \t]*\n[ \t]*([a-z])/g, "$1$2"));

  const lines = s.split("\n").map(line =>
    line.replace(/[ \t]+/g, " ").trim()
  );

  if ($("lineBreaks").checked) {
    return lines
      .filter(Boolean)
      .filter(line => !/^Evaluation\s+Only|^Created\s+with\s+Aspose|^Copyright\s+2002/i.test(line))
      .map(normalizeText)
      .filter(Boolean)
      .join("\n\n")
      .trim();
  }

  const blocks = [];
  let current = [];

  function pushCurrent() {
    if (current.length) {
      blocks.push(normalizeText(current.join("")));
      current = [];
    }
  }

  for (const line of lines) {
    if (!line) {
      pushCurrent();
      continue;
    }

    if (
      /^Evaluation\s+Only/i.test(line) ||
      /^Created\s+with\s+Aspose/i.test(line) ||
      /^Copyright\s+2002/i.test(line)
    ) {
      continue;
    }

    if (isStarLine(line) || isSoundLine(line)) {
      pushCurrent();
      blocks.push(normalizeText(line));
      continue;
    }

    // 同一段落中，PDF 自动折行直接连接。
    // 原始 PDF 识别出的段落间隔仍然保留。
    current.push(line);
  }

  pushCurrent();

  return blocks.filter(Boolean).join("\n\n").trim();
}

function extractLines(items) {
  const raw = [];

  for (const item of items) {
    if (!item.str || !item.str.trim()) continue;

    const transform = item.transform || [1, 0, 0, 12, 0, 0];

    raw.push({
      x: transform[4],
      y: transform[5],
      height: Math.abs(transform[3]) || 12,
      width: Number(item.width) || 0,
      text: item.str
    });
  }

  if (!raw.length) return "";

  raw.sort((a, b) => {
    if (Math.abs(a.y - b.y) > 2.5) return b.y - a.y;
    return a.x - b.x;
  });

  const lines = [];

  for (const item of raw) {
    let line = null;

    for (let i = lines.length - 1; i >= 0; i--) {
      const candidate = lines[i];

      if (Math.abs(candidate.y - item.y) < 2.5) {
        line = candidate;
        break;
      }

      if (candidate.y - item.y > 3) break;
    }

    if (!line) {
      line = { y: item.y, height: item.height, items: [] };
      lines.push(line);
    }

    line.items.push(item);
    line.height = Math.max(line.height, item.height);
  }

  lines.sort((a, b) => b.y - a.y);

  function joinItems(line) {
    const parts = line.items.sort((a, b) => a.x - b.x);
    let result = "";
    let previous = null;

    for (const item of parts) {
      const text = item.text;
      if (!text) continue;

      if (previous) {
        const prevChar = previous.text.slice(-1);
        const nextChar = text[0];
        const gap = item.x - (previous.x + previous.width);

        const prevLatin = /[A-Za-z0-9]$/.test(prevChar);
        const nextLatin = /^[A-Za-z0-9]/.test(nextChar);

        if (
          prevLatin && nextLatin &&
          gap > Math.max(1.2, item.height * 0.12) &&
          !/\s$/.test(result)
        ) {
          result += " ";
        }
      }

      result += text;
      previous = item;
    }

    return result.replace(/[ \t]+/g, " ").trim();
  }

  for (const line of lines) {
    line.text = joinItems(line);
  }

  const nonEmpty = lines.filter(line => line.text);
  if (!nonEmpty.length) return "";

  const gaps = [];

  for (let i = 1; i < nonEmpty.length; i++) {
    const gap = Math.abs(nonEmpty[i - 1].y - nonEmpty[i].y);
    if (gap > 0) gaps.push(gap);
  }

  gaps.sort((a, b) => a - b);

  let typicalGap = gaps.length
    ? gaps[Math.floor((gaps.length - 1) * 0.35)]
    : 0;

  if (!typicalGap) {
    typicalGap = nonEmpty[0].height * 1.2 || 12;
  }

  const leftEdges = nonEmpty
    .map(line => Math.min(...line.items.map(item => item.x)))
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  const baseLeft = leftEdges.length
    ? leftEdges[Math.floor((leftEdges.length - 1) * 0.2)]
    : 0;

  const output = [];

  for (let i = 0; i < nonEmpty.length; i++) {
    const line = nonEmpty[i];
    line.left = Math.min(...line.items.map(item => item.x));

    if (i > 0) {
      const previous = nonEmpty[i - 1];
      const gap = Math.abs(previous.y - line.y);

      const threshold = Math.max(
        typicalGap * 1.55,
        (previous.height + line.height) * 0.95
      );

      const verticalParagraphGap = gap > threshold;
      const indentParagraphStart = line.left > baseLeft + 10;

      if (verticalParagraphGap || indentParagraphStart) {
        output.push("");
      }
    }

    output.push(line.text);
  }

  return output.join("\n");
}

/* 从 PDF 页面提取第一个嵌入图片 */

function imageToDataURL(img) {
  try {
    if (!img) return null;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    if (img.bitmap) {
      canvas.width = img.bitmap.width;
      canvas.height = img.bitmap.height;
      ctx.drawImage(img.bitmap, 0, 0);
    } else if (
      img.data &&
      img.width &&
      img.height
    ) {
      canvas.width = img.width;
      canvas.height = img.height;

      const data = img.data;
      const pixels = new Uint8ClampedArray(img.width * img.height * 4);

      if (data.length === pixels.length) {
        pixels.set(data);
      } else if (data.length === img.width * img.height * 3) {
        for (let j = 0, k = 0; j < data.length; j += 3, k += 4) {
          pixels[k] = data[j];
          pixels[k + 1] = data[j + 1];
          pixels[k + 2] = data[j + 2];
          pixels[k + 3] = 255;
        }
      } else if (data.length === img.width * img.height) {
        for (let j = 0, k = 0; j < data.length; j++, k += 4) {
          pixels[k] = data[j];
          pixels[k + 1] = data[j];
          pixels[k + 2] = data[j];
          pixels[k + 3] = 255;
        }
      } else {
        return null;
      }

      ctx.putImageData(
        new ImageData(pixels, img.width, img.height),
        0,
        0
      );
    } else if (
      img.width &&
      img.height &&
      typeof img === "object"
    ) {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
    } else {
      return null;
    }

    const result = canvas.toDataURL("image/jpeg", 0.92);
    canvas.width = 0;
    canvas.height = 0;

    return result && result.length > 1000 ? result : null;
  } catch (e) {
    return null;
  }
}

function getPageImage(page) {
  return new Promise(async resolve => {
    try {
      const ops = await page.getOperatorList();

      const imageOps = new Set([
        pdfjsLib.OPS.paintImageXObject,
        pdfjsLib.OPS.paintInlineImageXObject,
        pdfjsLib.OPS.paintImageMaskXObject,
        pdfjsLib.OPS.paintImageXObjectRepeat,
        pdfjsLib.OPS.paintInlineImageXObjectGroup
      ].filter(v => v !== undefined));

      for (let i = 0; i < ops.fnArray.length; i++) {
        if (!imageOps.has(ops.fnArray[i])) continue;

        const args = ops.argsArray[i];
        if (!args || !args.length) continue;

        const ref = args[0];

        if (ref && typeof ref === "object") {
          const direct = imageToDataURL(ref);
          if (direct) return resolve(direct);
        }

        if (typeof ref === "string") {
          try {
            const img = await new Promise(done => {
              let finished = false;

              const timer = setTimeout(() => {
                if (!finished) {
                  finished = true;
                  done(null);
                }
              }, 3000);

              page.objs.get(ref, obj => {
                if (!finished) {
                  finished = true;
                  clearTimeout(timer);
                  done(obj);
                }
              });
            });

            const result = imageToDataURL(img);
            if (result) return resolve(result);
          } catch (e) {}
        }
      }

      resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}

async function extractPDF(file, fileIndex) {
  const pdf = await pdfjsLib.getDocument({
    data: await file.arrayBuffer()
  }).promise;

  const pages = [];
  let coverDataUrl = null;

  for (let p = 1; p <= pdf.numPages; p++) {
    status(`正在提取 ${file.name}：第 ${p}/${pdf.numPages} 页`);

    const page = await pdf.getPage(p);

    // 只提取整批 PDF 中找到的第一张图片。
    if (!coverFound) {
      coverDataUrl = await getPageImage(page);

      if (coverDataUrl) {
        coverFound = true;
      }
    }

    const content = await page.getTextContent();
    pages.push(extractLines(content.items));

    progress(60 * (fileIndex + p / pdf.numPages) / files.length);

    if (p % 8 === 0) {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }

  return {
    name: file.name.replace(/\.pdf$/i, ""),
    pageCount: pdf.numPages,
    text: cleanText(pages.join("\n")),
    coverDataUrl
  };
}

function splitHeadings(text, fallbackTitle) {
  const source = String(text || "");

  const chapterMark =
    /(?:(特别外传|特别篇|外传|这是)\s*)?(?:第\s*)?([0-9０-９]+|[零〇一二两三四五六七八九十百千万廿卅]+)\s*(?:个\s*)?(章节|章|节|卷|部|篇|回|话|幕|次)(?:开始)?(?:\s*[。．.!！?？])?(?=$|[\s\n。．.!！?？，,;；:：、」』”’"')）】])/g;

  function toNumber(raw) {
    if (!raw) return null;

    raw = raw.replace(/[０-９]/g, c =>
      String.fromCharCode(c.charCodeAt(0) - 0xFEE0)
    );

    if (/^\d+$/.test(raw)) return Number(raw);

    const digits = {
      零: 0, 〇: 0, 一: 1, 二: 2, 两: 2,
      三: 3, 四: 4, 五: 5, 六: 6,
      七: 7, 八: 8, 九: 9
    };

    if (/^[零〇一二两三四五六七八九]+$/.test(raw)) {
      return Number([...raw].map(c => digits[c]).join(""));
    }

    if (raw.startsWith("廿") || raw.startsWith("卅")) {
      const base = raw[0] === "廿" ? 20 : 30;
      const rest = raw.slice(1);

      if (!rest) return base;

      if ([...rest].every(c => c in digits)) {
        return base + Number([...rest].map(c => digits[c]).join(""));
      }

      return null;
    }

    const units = { 十: 10, 百: 100, 千: 1000, 万: 10000 };
    let total = 0, section = 0, number = 0;

    for (const c of raw) {
      if (c in digits) {
        number = digits[c];
      } else if (c in units) {
        const unit = units[c];

        if (unit === 10000) {
          section += number;
          total += (section || 1) * unit;
          section = 0;
          number = 0;
        } else {
          section += (number || (unit === 10 ? 1 : 0)) * unit;
          number = 0;
        }
      } else {
        return null;
      }
    }

    return total + section + number;
  }

  const tokens = [];
  chapterMark.lastIndex = 0;

  let match;

  while ((match = chapterMark.exec(source)) !== null) {
    const prefix = match[1] || "";
    const marker = match[0].trim().replace(/开始[。．.!！?？]*$/, "");
    const number = toNumber(match[2]);
    const unit = match[3];

    const before = source.slice(0, match.index);
    const currentLine = before.slice(before.lastIndexOf("\n") + 1).trimEnd();

    const atLineStart = currentLine.trim() === "";
    const afterSentence = /[。！？!?…」』”’"')）】]$/.test(currentLine.trimEnd());
    const hasExplicitPrefix = !!prefix || /第\s*/.test(marker);

    if (!hasExplicitPrefix && !atLineStart && !afterSentence) continue;
    if (!atLineStart && !afterSentence && !prefix) continue;

    tokens.push({
      start: match.index,
      end: match.index + match[0].length,
      marker,
      title: (prefix ? prefix : "") + marker.replace(/^(?:特别外传|特别篇|外传|这是)\s*/, ""),
      number,
      unit,
      prefix,
      explicit: /第\s*/.test(marker),
      atLineStart,
      afterSentence
    });
  }

  const accepted = [];
  let previousNumber = null;
  let previousWasExtra = false;

  for (const token of tokens) {
    const isExtra = /^(特别外传|特别篇|外传)/.test(token.title);

    if (
      previousNumber !== null &&
      !isExtra &&
      !previousWasExtra &&
      token.number <= previousNumber
    ) {
      continue;
    }

    accepted.push(token);
    previousNumber = token.number;
    previousWasExtra = isExtra;
  }

  if (!accepted.length) {
    const body = source.trim();
    return body ? [{ title: fallbackTitle, text: body }] : [];
  }

  const chapters = [];
  let cursor = 0;
  let title = fallbackTitle;
  let buffer = "";

  function flush() {
    const body = buffer.trim();
    if (body) chapters.push({ title, text: body });
    buffer = "";
  }

  for (const token of accepted) {
    buffer += source.slice(cursor, token.start);
    flush();
    title = token.title;
    cursor = token.end;
  }

  buffer += source.slice(cursor);
  flush();

  return chapters;
}

function makeChapters(documents) {
  const keepFiles = $("keepFiles").checked;
  const detect = $("detect").checked;
  let chapters = [];

  if (keepFiles) {
    for (const doc of documents) {
      if (detect) {
        const parts = splitHeadings(doc.text, doc.name);

        if (parts.length > 1) {
          parts.forEach((part, i) => {
            if (i === 0 && part.title === doc.name) {
              part.title = doc.name + " — 正文";
            }
            chapters.push(part);
          });
        } else {
          const only = parts[0];

          chapters.push({
            title: only && only.title ? only.title : doc.name,
            text: only && only.text ? only.text : doc.text
          });
        }
      } else {
        chapters.push({ title: doc.name, text: doc.text });
      }
    }
  } else {
    const merged = documents.map(doc => doc.text).join("\n\n");

    chapters = detect
      ? splitHeadings(merged, "正文")
      : [{ title: "正文", text: merged }];
  }

  return chapters.filter(ch => ch.text.trim());
}

function paragraphs(text) {
  const source = removeAsposeWatermark(String(text || "")
    .replace(/\u00a0/g, " ")
    .replace(/\r\n?/g, "\n"));

  const rawBlocks = source
    .split(/\n[ \t]*\n+/)
    .map(block => block.trim())
    .filter(Boolean);

  function normalize(s) {
    return normalizeText(s.replace(/[ \t]+/g, " "));
  }

  const output = [];

  for (const block of rawBlocks) {
    if ($("lineBreaks").checked) {
      const lines = block.split("\n").map(normalize).filter(Boolean);

      for (const line of lines) {
        output.push("<p>" + escapeHTML(line) + "</p>");
      }

      continue;
    }

    const result = normalize(block);

    if (!result) continue;

    // 不按句号、问号、感叹号强制拆段。
    // 保留 PDF 原始段落识别结果。
    output.push("<p>" + escapeHTML(result) + "</p>");
  }

  return output.join("\n");
}

function xhtml(title, body) {
  return `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh">
<head>
<title>${escapeHTML(title)}</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h1>${escapeHTML(title)}</h1>
${body}
</body>
</html>`;
}

$("start").addEventListener("click", async () => {
  if (!files.length) return;

  if (!window.pdfjsLib || !window.JSZip) {
    say("库加载失败。请检查网络连接并刷新页面。");
    return;
  }

  $("start").disabled = true;
  $("files").disabled = true;
  progress(0);
  coverFound = false;

  try {
    const documents = [];
    const report = [];

    for (let i = 0; i < files.length; i++) {
      const doc = await extractPDF(files[i], i);
      documents.push(doc);

      report.push(
        `${doc.name}: ${doc.pageCount} 页，${doc.text.length} 个字符`
      );

      if (doc.text.length < 100) {
        report.push("警告：提取文字很少，可能是扫描版或字体编码异常。");
      }
    }

    const chapters = makeChapters(documents);

    if (!chapters.length) {
      throw new Error("没有提取到可用正文。");
    }

    const title = $("title").value.trim() || "PDF 合集";
    const author = $("author").value.trim() || "未知作者";
    const zip = new JSZip();

    zip.file("mimetype", "application/epub+zip", {
      compression: "STORE"
    });

    zip.file("META-INF/container.xml", `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
</container>`);

    let manifest = "";
    let spine = "";
    let toc = "<ol>";

    // 从所有 PDF 中取得第一个成功提取的图片。
    const coverDataUrl =
      documents.find(d => d.coverDataUrl)?.coverDataUrl || null;

    if (coverDataUrl) {
      const base64 = coverDataUrl.split(",")[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      zip.file("OEBPS/cover.jpg", bytes, { binary: true });

      manifest +=
        '<item id="cover-image" href="cover.jpg" media-type="image/jpeg" properties="cover-image"/>';
    }

    chapters.forEach((chapter, i) => {
      const id = `ch${i + 1}`;
      const href = `chapter${i + 1}.xhtml`;

      manifest +=
        `<item id="${id}" href="${href}" media-type="application/xhtml+xml"/>`;

      spine += `<itemref idref="${id}"/>`;

      toc += `<li><a href="${href}">${escapeHTML(chapter.title)}</a></li>`;

      zip.file(
        `OEBPS/${href}`,
        xhtml(chapter.title, paragraphs(chapter.text))
      );
    });

    toc += "</ol>";

    zip.file("OEBPS/nav.xhtml", `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh">
<head><title>目录</title></head>
<body><nav epub:type="toc" id="toc"><h1>目录</h1>${toc}</nav></body>
</html>`);

    zip.file(
      "OEBPS/style.css",
      "body{font-family:serif;line-height:1.8;margin:5%;}" +
      "h1{text-align:center;font-size:1.4em;margin:1.5em 0;}" +
      "p{text-indent:0 !important;margin:1em 0;}"
    );

    const uid = "pdf-epub-" + Date.now();
    const modified = new Date()
      .toISOString()
      .replace(/\.\d{3}Z$/, "Z");

    zip.file("OEBPS/content.opf", `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid" xml:lang="zh">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="uid">${uid}</dc:identifier>
<dc:title>${escapeHTML(title)}</dc:title>
<dc:language>zh</dc:language>
<dc:creator>${escapeHTML(author)}</dc:creator>
${coverDataUrl ? '<meta name="cover" content="cover-image"/>' : ''}
<meta property="dcterms:modified">${modified}</meta>
</metadata>
<manifest>
<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
${manifest}
<item id="css" href="style.css" media-type="text/css"/>
</manifest>
<spine>${spine}</spine>
</package>`);

    status("正在打包 EPUB……");
    progress(75);

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/epub+zip",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    }, meta => {
      progress(75 + meta.percent * 0.25);
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
      (title.replace(/[\\/:*?"<>|]/g, "_") || "book") + ".epub";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);

    status("转换完成");
    progress(100);

    say(
      "转换完成！\n\n" +
      report.join("\n") +
      `\n\n生成章节：${chapters.length}` +
      `\n封面图片：${coverDataUrl ? "已提取" : "未找到可提取的图片"}` +
      `\nEPUB 大小：${(blob.size / 1048576).toFixed(2)} MB`
    );

  } catch (error) {
    console.error(error);
    status("转换失败");
    say("错误：" + (error.message || String(error)));
  } finally {
    $("start").disabled = files.length === 0;
    $("files").disabled = false;
  }
});

})();
</script>
</body>
</html>
