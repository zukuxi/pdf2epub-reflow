
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 批量转 EPUB</title>
<style>
:root{color-scheme:light dark}
body{font:16px/1.6 system-ui,sans-serif;max-width:850px;margin:25px auto;padding:0 16px}
h1{font-size:1.7em}
section{border:1px solid #8886;border-radius:14px;padding:16px;margin:16px 0}
input[type=text],input[type=file]{width:100%;box-sizing:border-box;padding:10px;margin:6px 0}
button{padding:9px 14px;margin:4px;border:1px solid #8888;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.primary{background:#315bd6;color:white;border:0}
.file{padding:10px 0;border-bottom:1px solid #8884;overflow-wrap:anywhere}
.file button{padding:4px 9px}
.muted{opacity:.75;font-size:.9em}
label{display:block;margin:12px 0}
progress{width:100%}
#log{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}
</style>
</head>
<body>
<h1>PDF 批量转 EPUB 在第一次基础上检查2修复</h1>
<p class="muted">批量提取 PDF 文字、合并正文、识别章节并生成 EPUB 目录。文件在浏览器本地处理。</p>

<section>
<h2>1. 选择 PDF</h2>
<input id="files" type="file" accept=".pdf,application/pdf" multiple>
<div id="fileList">尚未选择文件</div>
<p class="muted">可以调整文件顺序。扫描图片型 PDF 不支持 OCR。</p>
</section>

<section>
<h2>2. 书籍设置</h2>
<label>书名<input id="title" type="text" placeholder="输入书名"></label>
<label>作者<input id="author" type="text" placeholder="未知作者"></label>
<label><input id="keepFiles" type="checkbox" checked> 每份 PDF 保留独立章节</label>
<label><input id="detect" type="checkbox" checked> 自动识别章节标题并生成目录</label>
<label><input id="clean" type="checkbox" checked> 清理中文多余空格和英文断词</label>
<button id="start" class="primary" disabled>开始转换并下载 EPUB</button>
</section>

<section>
<h2>3. 转换进度</h2>
<progress id="progress" value="0" max="100"></progress>
<p id="status">等待选择文件</p>
<pre id="log">转换结果会显示在这里。</pre>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
let files = [];

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function say(message) {
  $("log").textContent = message;
}

function status(message) {
  $("status").textContent = message;
}

function progress(value) {
  $("progress").value = value;
}

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderFiles() {
  const box = $("fileList");
  box.replaceChildren();

  if (!files.length) {
    box.textContent = "尚未选择文件";
    $("start").disabled = true;
    return;
  }

  files.forEach((file, i) => {
    const row = document.createElement("div");
    row.className = "file";

    const name = document.createElement("span");
    name.textContent =
      `${i + 1}. ${file.name} (${(file.size / 1048576).toFixed(2)} MB) `;
    row.appendChild(name);

    for (const [label, delta] of [
      ["上移", -1],
      ["下移", 1],
      ["删除", 0]
    ]) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.disabled =
        (delta === -1 && i === 0) ||
        (delta === 1 && i === files.length - 1);

      button.onclick = () => {
        if (label === "删除") {
          files.splice(i, 1);
        } else {
          const target = i + delta;
          [files[i], files[target]] = [files[target], files[i]];
        }
        renderFiles();
      };

      row.appendChild(button);
    }

    box.appendChild(row);
  });

  $("start").disabled = false;

  if (!$("title").value && files.length) {
    $("title").value = files[0].name.replace(/\.pdf$/i, "");
  }
}

$("files").addEventListener("change", event => {
  files = Array.from(event.target.files || []);
  renderFiles();
  say(files.length ? "文件已载入，可以开始转换。" : "请选择 PDF。");
});

function isStarLine(s) {
  return /^\*+$/.test(String(s || "").trim());
}

function isSoundLine(s) {
  return /^[\u3400-\u9fff]{1,8}[—–\-…]+$/.test(
    String(s || "").trim()
  );
}

function cleanText(s) {
  if (!s) return "";

  s = String(s)
    .replace(/\u00a0/g, " ")
    .replace(/\r\n?/g, "\n")
    .replace(/([A-Za-z])-[ \t]*\n[ \t]*([a-z])/g, "$1$2");

  const lines = s.split("\n").map(line =>
    line.replace(/[ \t]+/g, " ").trim()
  );

  const blocks = [];
  let current = [];

  function pushCurrent() {
    if (current.length) {
      blocks.push(current.join(" "));
      current = [];
    }
  }

  for (const line of lines) {
    if (!line) {
      pushCurrent();
      continue;
    }

    if (isStarLine(line) || isSoundLine(line)) {
      pushCurrent();
      blocks.push(line.trim());
    } else {
      current.push(line);
    }
  }

  pushCurrent();

  return blocks.map(block => {
    let result = block;

    if ($("clean").checked) {
      result = result.replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+(?=[\u3400-\u9fff\uf900-\ufaff])/g,
        "$1"
      );

      result = result.replace(/([，。！？；：、])[ \t]+/g, "$1");

      result = result.replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+([，。！？；：、）》】」』〕〉％…])/g,
        "$1$2"
      );

      result = result.replace(/([（【「『〔〈])[ \t]+/g, "$1");
      result = result.replace(/[ \t]+([）】」』〕〉])/g, "$1");
    }

    return result.trim();
  }).filter(Boolean).join("\n\n").trim();
}

function extractLines(items) {
  const raw = [];

  for (const item of items) {
    if (!item.str || !item.str.trim()) continue;

    const transform = item.transform || [1, 0, 0, 12, 0, 0];

    raw.push({
      x: transform[4],
      y: transform[5],
      height: Math.abs(transform[3]) || 12,
      width: Number(item.width) || 0,
      text: item.str
    });
  }

  if (!raw.length) return "";

  raw.sort((a, b) => {
    if (Math.abs(a.y - b.y) > 2.5) return b.y - a.y;
    return a.x - b.x;
  });

  const lines = [];

  for (const item of raw) {
    let line = null;

    for (let i = lines.length - 1; i >= 0; i--) {
      const candidate = lines[i];

      if (Math.abs(candidate.y - item.y) < 2.5) {
        line = candidate;
        break;
      }

      if (candidate.y - item.y > 3) break;
    }

    if (!line) {
      line = { y: item.y, height: item.height, items: [] };
      lines.push(line);
    }

    line.items.push(item);
    line.height = Math.max(line.height, item.height);
  }

  lines.sort((a, b) => b.y - a.y);

  function joinItems(line) {
    const parts = line.items.sort((a, b) => a.x - b.x);

    let result = "";
    let previous = null;

    for (const item of parts) {
      const text = item.text;
      if (!text) continue;

      if (previous) {
        const prevChar = previous.text.slice(-1);
        const nextChar = text[0];
        const gap = item.x - (previous.x + previous.width);

        const prevLatin = /[A-Za-z0-9]$/.test(prevChar);
        const nextLatin = /^[A-Za-z0-9]/.test(nextChar);

        if (
          prevLatin && nextLatin &&
          gap > Math.max(1.2, item.height * 0.12) &&
          !/\s$/.test(result)
        ) {
          result += " ";
        }
      }

      result += text;
      previous = item;
    }

    return result.replace(/[ \t]+/g, " ").trim();
  }

  for (const line of lines) {
    line.text = joinItems(line);
  }

  const nonEmpty = lines.filter(line => line.text);
  if (!nonEmpty.length) return "";

  const gaps = [];

  for (let i = 1; i < nonEmpty.length; i++) {
    const gap = Math.abs(nonEmpty[i - 1].y - nonEmpty[i].y);
    if (gap > 0) gaps.push(gap);
  }

  gaps.sort((a, b) => a - b);

  let typicalGap = gaps.length
    ? gaps[Math.floor((gaps.length - 1) * 0.35)]
    : 0;

  if (!typicalGap) {
    typicalGap = nonEmpty[0].height * 1.2 || 12;
  }

  const leftEdges = nonEmpty
    .map(line => Math.min(...line.items.map(item => item.x)))
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  const baseLeft = leftEdges.length
    ? leftEdges[Math.floor((leftEdges.length - 1) * 0.2)]
    : 0;

  const output = [];

  for (let i = 0; i < nonEmpty.length; i++) {
    const line = nonEmpty[i];
    line.left = Math.min(...line.items.map(item => item.x));

    if (i > 0) {
      const previous = nonEmpty[i - 1];
      const gap = Math.abs(previous.y - line.y);

      const threshold = Math.max(
        typicalGap * 1.55,
        (previous.height + line.height) * 0.95
      );

      const verticalParagraphGap = gap > threshold;
      const indentParagraphStart = line.left > baseLeft + 10;

      if (verticalParagraphGap || indentParagraphStart) {
        output.push("");
      }
    }

    output.push(line.text);
  }

  return output.join("\n");
}

async function extractPDF(file, fileIndex) {
  const pdf = await pdfjsLib.getDocument({
    data: await file.arrayBuffer()
  }).promise;

  const pages = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    status(`正在提取 ${file.name}：第 ${p}/${pdf.numPages} 页`);

    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    pages.push(extractLines(content.items));

    progress(60 * (fileIndex + p / pdf.numPages) / files.length);

    if (p % 8 === 0) {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }

  return {
    name: file.name.replace(/\.pdf$/i, ""),
    pageCount: pdf.numPages,
    text: cleanText(pages.join("\n"))
  };
}

const headingPattern =
  /^(chapter|chap(?:ter)?\.?\s*[\w.-]+|第[0-9一二三四五六七八九十百零〇两]+[章节卷部篇回].*|序章|序言|前言|楔子|尾声|后记|番外(?:篇)?(?:\s*\d*)?|prologue|epilogue|preface|afterword|interlude)(?:\s*[:：\-—].*)?$/i;

function splitHeadings(text, fallbackTitle) {
  const lines = text.split(/\n/);
  const chapters = [];

  let title = fallbackTitle;
  let buffer = [];

  for (const line of lines) {
    const t = line.trim();

    const isHeading =
      t.length > 0 &&
      t.length <= 90 &&
      headingPattern.test(t);

    if (isHeading && buffer.join("\n").trim().length > 80) {
      const body = buffer.join("\n").trim();
      if (body) chapters.push({ title, text: body });

      title = t;
      buffer = [];
    }

    buffer.push(line);
  }

  const last = buffer.join("\n").trim();
  if (last) chapters.push({ title, text: last });

  return chapters;
}

function makeChapters(documents) {
  const keepFiles = $("keepFiles").checked;
  const detect = $("detect").checked;
  let chapters = [];

  if (keepFiles) {
    for (const doc of documents) {
      if (detect) {
        const parts = splitHeadings(doc.text, doc.name);

        if (parts.length > 1) {
          parts.forEach((part, i) => {
            if (i === 0 && part.title === doc.name) {
              part.title = doc.name + " — 正文";
            }
            chapters.push(part);
          });
        } else {
          chapters.push({ title: doc.name, text: doc.text });
        }
      } else {
        chapters.push({ title: doc.name, text: doc.text });
      }
    }
  } else {
    const merged = documents.map(doc => doc.text).join("\n\n");

    chapters = detect
      ? splitHeadings(merged, "正文")
      : [{ title: "正文", text: merged }];
  }

  return chapters.filter(ch => ch.text.trim());
}

/*
 * 第二轮补救：
 * 第一轮先按原有方式处理。
 * 只有第一轮产生的异常长段落，才进入此函数。
 * 这里允许不同类型的引号互相闭合，以应对 PDF 中引号字符不一致的情况。
 */
function repairLongParagraph(s) {
  s = String(s || "").trim();

  if (
    s.length < 700 ||
    /^\*+$/.test(s) ||
    /^[\u3400-\u9fff]{1,8}[—–\-…]+$/.test(s)
  ) {
    return [s];
  }

  const result = [];
  let buffer = "";
  const quoteStack = [];

  const openingQuotes = new Set(["“", "「", "『", "‘", "（", "【"]);
  const closingQuotes = new Set(["”", "」", "』", "’", "）", "】"]);

  function normalize(s) {
    s = s.replace(/[ \t]+/g, " ").trim();

    if ($("clean").checked) {
      s = s.replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+(?=[\u3400-\u9fff\uf900-\ufaff])/g,
        "$1"
      );
      s = s.replace(/([，。！？；：、])[ \t]+/g, "$1");
      s = s.replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+([，。！？；：、）》】」』〕〉％…])/g,
        "$1$2"
      );
      s = s.replace(/([（【「『〔〈])[ \t]+/g, "$1");
      s = s.replace(/[ \t]+([）】」』〕〉])/g, "$1");
    }

    return s.trim();
  }

  function flush() {
    const value = normalize(buffer);
    if (value) result.push(value);
    buffer = "";
  }

  function endsSentence(s) {
    return /[。！？!?][”」』’"）】〉》]*$/.test(s.trim());
  }

  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const next = s[i + 1] || "";

    if (ch === '"') {
      buffer += ch;

      // 容错：若已有未闭合的引号，则把英文双引号视为其闭引号。
      if (quoteStack.length) {
        quoteStack.pop();

        if (quoteStack.length === 0 && endsSentence(buffer)) {
          flush();
        }
      } else {
        quoteStack.push('"');
      }

      continue;
    }

    if (openingQuotes.has(ch)) {
      quoteStack.push(ch);
      buffer += ch;
      continue;
    }

    if (closingQuotes.has(ch)) {
      buffer += ch;

      // 不要求开闭引号字符必须完全匹配，避免引号不一致导致整段无法拆分。
      if (quoteStack.length) {
        quoteStack.pop();

        if (quoteStack.length === 0 && endsSentence(buffer)) {
          flush();
        }
      }

      continue;
    }

    buffer += ch;

    if (quoteStack.length) continue;

    // 只在第二轮的异常长段落中启用句末分段。
    if (/[。！？!?]/.test(ch)) {
      flush();
      continue;
    }

    // 对话结束后紧接叙述时，另起一段。
    if (
      /[”」』"’]/.test(ch) &&
      /\s/.test(next) &&
      next &&
      !/^[“「『‘"]$/.test(s[i + 2] || "")
    ) {
      flush();
    }
  }

  flush();

  // 只有确实拆出了多个段落时才采用第二轮结果。
  // 如果没有发现边界，则完整保留第一轮原段落。
  return result.length > 1 ? result : [s];
}

function paragraphs(text) {
  const source = String(text || "")
    .replace(/\u00a0/g, " ")
    .replace(/\r\n?/g, "\n");

  const rawBlocks = source.split(/\n[ \t]*\n+/);
  const output = [];

  const quotePairs = {
    "“": "”",
    "「": "」",
    "『": "』",
    "‘": "’"
  };

  const closingQuotes = new Set(["”", "」", "』", "’"]);
  const endPunctuation = new Set(["。", "！", "？", "!", "?"]);

  function normalize(s) {
    s = s.replace(/[ \t]+/g, " ").trim();

    if ($("clean").checked) {
      s = s.replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+(?=[\u3400-\u9fff\uf900-\ufaff])/g,
        "$1"
      );

      s = s.replace(/([，。！？；：、])[ \t]+/g, "$1");

      s = s.replace(
        /([\u3400-\u9fff\uf900-\ufaff])[ \t]+([，。！？；：、）》】」』〕〉％…])/g,
        "$1$2"
      );

      s = s.replace(/([（【「『〔〈])[ \t]+/g, "$1");
      s = s.replace(/[ \t]+([）】])/g, "$1");
    }

    return s.trim();
  }

  function isOpeningQuote(ch) {
    return Object.prototype.hasOwnProperty.call(quotePairs, ch);
  }

  function isClosingQuote(ch) {
    return closingQuotes.has(ch);
  }

  function isStar(s) {
    return /^\*+$/.test(s.trim());
  }

  function isSound(s) {
    return /^[\u3400-\u9fff]{1,8}[—–\-…]+$/.test(s.trim());
  }

  function updateQuoteState(s, stack) {
    for (const ch of s) {
      if (ch === '"') {
        if (stack[stack.length - 1] === '"') stack.pop();
        else stack.push('"');
      } else if (isOpeningQuote(ch)) {
        stack.push(quotePairs[ch]);
      } else if (
        isClosingQuote(ch) &&
        stack[stack.length - 1] === ch
      ) {
        stack.pop();
      }
    }
  }

  // 第一轮逻辑：保留原有空白行及引号状态判断。
  const mergedBlocks = [];
  let pending = [];
  const quoteState = [];

  for (const block of rawBlocks) {
    if (!block.trim()) continue;

    const trimmed = block.trim();

    if (isStar(trimmed) || isSound(trimmed)) {
      if (pending.length) {
        mergedBlocks.push(pending.join(" "));
        pending = [];
        quoteState.length = 0;
      }

      mergedBlocks.push(trimmed);
      continue;
    }

    pending.push(trimmed);
    updateQuoteState(block, quoteState);

    if (quoteState.length === 0) {
      mergedBlocks.push(pending.join(" "));
      pending = [];
    }
  }

  if (pending.length) {
    mergedBlocks.push(pending.join(" "));
  }

  function splitParagraph(s) {
    s = normalize(s);
    if (!s) return [];

    if (isStar(s) || isSound(s)) return [s];

    const result = [];
    let buffer = "";
    const quoteStack = [];

    function flush() {
      const value = normalize(buffer);
      if (value) result.push(value);
      buffer = "";
    }

    function insideQuote() {
      return quoteStack.length > 0;
    }

    function endsSentence(value) {
      return /[。！？!?][”」』’"）】〉》]*$/.test(value.trim());
    }

    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      const prev = s[i - 1] || "";
      const next = s[i + 1] || "";
      const depthBefore = quoteStack.length;

      if (ch === '"') {
        if (quoteStack[quoteStack.length - 1] === '"') {
          quoteStack.pop();
          buffer += ch;

          if (!insideQuote() && endsSentence(buffer)) {
            flush();
          }
        } else {
          quoteStack.push('"');
          buffer += ch;
        }
        continue;
      }

      if (isOpeningQuote(ch)) {
        quoteStack.push(quotePairs[ch]);
        buffer += ch;
        continue;
      }

      if (isClosingQuote(ch)) {
        if (quoteStack[quoteStack.length - 1] === ch) {
          quoteStack.pop();
        }

        buffer += ch;

        if (
          depthBefore > 0 &&
          !insideQuote() &&
          endsSentence(buffer)
        ) {
          flush();
        }
        continue;
      }

      buffer += ch;

      if (insideQuote()) continue;

      if (endPunctuation.has(ch)) {
        flush();
        continue;
      }

      if (
        ch === " " &&
        /[”」』"’]/.test(prev) &&
        next &&
        !/\s/.test(next) &&
        !isOpeningQuote(next) &&
        next !== '"'
      ) {
        flush();
      }
    }

    flush();
    return result;
  }

  // 第一轮结果保持不变；只对过长的单段运行第二轮补救。
  const firstPass = [];

  for (const block of mergedBlocks) {
    firstPass.push(...splitParagraph(block));
  }

  const finalPass = [];

  for (const paragraph of firstPass) {
    if (
      paragraph.length >= 700 &&
      !isStar(paragraph) &&
      !isSound(paragraph)
    ) {
      finalPass.push(...repairLongParagraph(paragraph));
    } else {
      finalPass.push(paragraph);
    }
  }

  return finalPass
    .filter(Boolean)
    .map(p => "<p>" + escapeHTML(p) + "</p>")
    .join("\n");
}

function xhtml(title, body) {
  return `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh">
<head>
<title>${escapeHTML(title)}</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h1>${escapeHTML(title)}</h1>
${body}
</body>
</html>`;
}

$("start").addEventListener("click", async () => {
  if (!files.length) return;

  if (!window.pdfjsLib || !window.JSZip) {
    say("库加载失败。请检查网络连接并刷新页面。");
    return;
  }

  $("start").disabled = true;
  $("files").disabled = true;
  progress(0);

  try {
    const documents = [];
    const report = [];

    for (let i = 0; i < files.length; i++) {
      const doc = await extractPDF(files[i], i);
      documents.push(doc);

      report.push(
        `${doc.name}: ${doc.pageCount} 页，${doc.text.length} 个字符`
      );

      if (doc.text.length < 100) {
        report.push("警告：提取文字很少，可能是扫描版或字体编码异常。");
      }
    }

    const chapters = makeChapters(documents);

    if (!chapters.length) {
      throw new Error("没有提取到可用正文。");
    }

    const title = $("title").value.trim() || "PDF 合集";
    const author = $("author").value.trim() || "未知作者";
    const zip = new JSZip();

    zip.file("mimetype", "application/epub+zip", {
      compression: "STORE"
    });

    zip.file("META-INF/container.xml", `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
</container>`);

    let manifest = "";
    let spine = "";
    let toc = "<ol>";

    chapters.forEach((chapter, i) => {
      const id = `ch${i + 1}`;
      const href = `chapter${i + 1}.xhtml`;

      manifest +=
        `<item id="${id}" href="${href}" media-type="application/xhtml+xml"/>`;

      spine += `<itemref idref="${id}"/>`;

      toc += `<li><a href="${href}">${escapeHTML(chapter.title)}</a></li>`;

      zip.file(
        `OEBPS/${href}`,
        xhtml(chapter.title, paragraphs(chapter.text))
      );
    });

    toc += "</ol>";

    zip.file("OEBPS/nav.xhtml", `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh">
<head><title>目录</title></head>
<body><nav epub:type="toc" id="toc"><h1>目录</h1>${toc}</nav></body>
</html>`);

    zip.file(
      "OEBPS/style.css",
      "body{font-family:serif;line-height:1.8;margin:5%;}" +
      "h1{text-align:center;font-size:1.4em;margin:1.5em 0;}" +
      "p{text-indent:0 !important;margin:1em 0;}"
    );

    const uid = "pdf-epub-" + Date.now();
    const modified = new Date()
      .toISOString()
      .replace(/\.\d{3}Z$/, "Z");

    zip.file("OEBPS/content.opf", `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid" xml:lang="zh">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="uid">${uid}</dc:identifier>
<dc:title>${escapeHTML(title)}</dc:title>
<dc:language>zh</dc:language>
<dc:creator>${escapeHTML(author)}</dc:creator>
<meta property="dcterms:modified">${modified}</meta>
</metadata>
<manifest>
<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
${manifest}
<item id="css" href="style.css" media-type="text/css"/>
</manifest>
<spine>${spine}</spine>
</package>`);

    status("正在打包 EPUB……");
    progress(75);

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/epub+zip",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    }, meta => {
      progress(75 + meta.percent * 0.25);
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
      (title.replace(/[\\/:*?"<>|]/g, "_") || "book") + ".epub";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);

    status("转换完成");
    progress(100);

    say(
      "转换完成！\n\n" +
      report.join("\n") +
      `\n\n生成章节：${chapters.length}` +
      `\nEPUB 大小：${(blob.size / 1048576).toFixed(2)} MB`
    );
  } catch (error) {
    console.error(error);
    status("转换失败");
    say("错误：" + (error.message || String(error)));
  } finally {
    $("start").disabled = files.length === 0;
    $("files").disabled = false;
  }
});

})();
</script>
</body>
</html>
