
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 批量转 EPUB</title>
<style>
:root{color-scheme:light dark}
body{font:16px/1.6 system-ui,sans-serif;max-width:850px;margin:25px auto;padding:0 16px}
h1{font-size:1.7em}
section{border:1px solid #8886;border-radius:14px;padding:16px;margin:16px 0}
input[type=text],input[type=file]{width:100%;box-sizing:border-box;padding:10px;margin:6px 0}
button{padding:9px 14px;margin:4px;border:1px solid #8888;border-radius:8px;cursor:pointer}
.primary{background:#315bd6;color:white;border:0}
.file{padding:10px 0;border-bottom:1px solid #8884;overflow-wrap:anywhere}
.file button{padding:4px 9px}
.muted{opacity:.75;font-size:.9em}
label{display:block;margin:12px 0}
progress{width:100%}
#log{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}
</style>
</head>
<body>
<h1>PDF 批量转 EPUB</h1>
<p class="muted">提取多个 PDF 的文字，合并正文，尝试识别章节并生成 EPUB 目录。文件只在浏览器本地处理。</p>

<section>
  <h2>1. 选择 PDF</h2>
  <input id="files" type="file" accept=".pdf,application/pdf" multiple>
  <div id="fileList">尚未选择文件</div>
  <p class="muted">使用上移、下移调整顺序。扫描图片型 PDF 不支持 OCR。</p>
</section>

<section>
  <h2>2. 书籍设置</h2>
  <label>书名
    <input id="title" type="text" placeholder="输入书名">
  </label>
  <label>作者
    <input id="author" type="text" placeholder="未知作者">
  </label>
  <label>
    <input id="keepFiles" type="checkbox" checked>
    每份 PDF 保留独立章节
  </label>
  <label>
    <input id="detect" type="checkbox" checked>
    自动识别章节标题并生成目录
  </label>
  <label>
    <input id="clean" type="checkbox" checked>
    清理强制换行、中文多余空格和常见断词
  </label>
  <button id="start" class="primary" disabled>开始转换并下载 EPUB</button>
</section>

<section>
  <h2>3. 转换进度</h2>
  <progress id="progress" value="0" max="100"></progress>
  <p id="status">等待选择文件</p>
  <pre id="log">转换结果会显示在这里。</pre>
</section>

<p class="muted">首次打开需要联网加载 PDF.js 和 JSZip。PDF 图片、原始版式及复杂排版不会保留。</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
let files = [];

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function say(message) {
  $("log").textContent = message;
}

function status(message) {
  $("status").textContent = message;
}

function progress(value) {
  $("progress").value = value;
}

function renderFiles() {
  const box = $("fileList");
  box.replaceChildren();

  if (!files.length) {
    box.textContent = "尚未选择文件";
    $("start").disabled = true;
    return;
  }

  files.forEach((file, i) => {
    const row = document.createElement("div");
    row.className = "file";

    const name = document.createElement("span");
    name.textContent =
      `${i + 1}. ${file.name} (${(file.size / 1048576).toFixed(2)} MB) `;
    row.appendChild(name);

    for (const [label, delta] of [
      ["上移", -1], ["下移", 1], ["删除", 0]
    ]) {
      const button = document.createElement("button");
      button.textContent = label;
      button.type = "button";
      button.disabled =
        (delta === -1 && i === 0) ||
        (delta === 1 && i === files.length - 1);

      button.onclick = () => {
        if (label === "删除") {
          files.splice(i, 1);
        } else {
          const target = i + delta;
          [files[i], files[target]] = [files[target], files[i]];
        }
        renderFiles();
      };

      row.appendChild(button);
    }

    box.appendChild(row);
  });

  $("start").disabled = false;

  if (!$("title").value && files.length) {
    $("title").value = files[0].name.replace(/\.pdf$/i, "");
  }
}

$("files").addEventListener("change", event => {
  files = Array.from(event.target.files || []);
  renderFiles();
  say(files.length ? "文件已载入，可以开始转换。" : "请选择 PDF。");
});

/* HTML 转义，防止书名、章节标题中的特殊字符破坏 EPUB */
function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/*
 * 正文清理：
 * 1. 修复英文单词被连字符断开的情况。
 * 2. 合并 PDF 每一行末尾的强制换行。
 * 3. 尽量保留真正的段落分隔。
 * 4. 清除中文字符之间多余的空格。
 */
function cleanText(s) {
  if (!s) return "";

  if (!$("clean").checked) {
    return s.replace(/\r\n?/g, "\n").trim();
  }

  s = s.replace(/\u00a0/g, " ")
       .replace(/\r\n?/g, "\n");

  // 修复英文断词，例如 inter-\nnational -> international
  s = s.replace(
    /([A-Za-z])-[ \t]*\n[ \t]*([a-z])/g,
    "$1$2"
  );

  // 先清理每一行两侧的空格
  let lines = s.split("\n").map(line =>
    line.replace(/[ \t]+/g, " ").trim()
  );

  // 空行用于识别段落边界；普通换行默认合并
  const blocks = [];
  let current = [];

  for (const line of lines) {
    if (!line) {
      if (current.length) {
        blocks.push(current);
        current = [];
      }
    } else {
      current.push(line);
    }
  }

  if (current.length) blocks.push(current);

  const isCJK = c =>
    /[\u3400-\u9fff\uf900-\ufaff]/.test(c || "");

  const noSpaceBefore =
    /^[，。！？；：、）》】」』〕〉％…]/;

  const noSpaceAfter =
    /[（【「『〔〈]$/;

  function joinLines(block) {
    let result = "";

    for (const line of block) {
      if (!result) {
        result = line;
        continue;
      }

      const prev = result.slice(-1);
      const next = line[0];

      // 中文相邻字符直接连接，不插入空格
      if (
        isCJK(prev) ||
        isCJK(next) ||
        noSpaceBefore.test(next) ||
        noSpaceAfter.test(prev)
      ) {
        result += line;
      } else {
        // 英文相邻行合并时保留单词分隔
        result += " " + line;
      }
    }

    // 删除中文字符之间的空格
    result = result.replace(
      /([\u3400-\u9fff\uf900-\ufaff])[ \t]+(?=[\u3400-\u9fff\uf900-\ufaff])/g,
      "$1"
    );

    // 删除中文与中文标点之间不合理的空格
    result = result.replace(
      /([\u3400-\u9fff\uf900-\ufaff])[ \t]+([，。！？；：、）》】」』〕〉])/g,
      "$1$2"
    );

    return result.trim();
  }

  return blocks
    .map(joinLines)
    .filter(Boolean)
    .join("\n\n")
    .trim();
}

/*
 * 从 PDF.js 的文字项目重建文本行。
 * 中文文字片段之间不再一律插入空格；
 * 英文单词之间则依据原始坐标间距决定是否加空格。
 */
function extractLines(items) {
  const lines = [];

  for (const item of items) {
    if (!item.str || !item.str.trim()) continue;

    const x = item.transform ? item.transform[4] : 0;
    const y = item.transform ? item.transform[5] : 0;
    const fontSize = Math.abs(
      item.transform ? item.transform[3] : 12
    ) || 12;

    // 同一基线上的文字项目合并成一行
    let line = lines.find(row => Math.abs(row.y - y) < 2.5);

    if (!line) {
      line = { y, items: [] };
      lines.push(line);
    }

    line.items.push({
      x,
      width: Number(item.width) || 0,
      text: item.str,
      fontSize
    });
  }

  // PDF 坐标原点通常在页面底部，因此 y 从大到小排序
  lines.sort((a, b) => b.y - a.y);

  function isCJK(c) {
    return /[\u3400-\u9fff\uf900-\ufaff]/.test(c || "");
  }

  function isLatinOrDigit(c) {
    return /[A-Za-z0-9]/.test(c || "");
  }

  function joinItems(items) {
    items.sort((a, b) => a.x - b.x);

    let result = "";
    let previous = null;

    for (const item of items) {
      const text = item.text.trim();
      if (!text) continue;

      if (previous) {
        const prevText = previous.text.trim();
        const prevChar = prevText.slice(-1);
        const nextChar = text[0];

        const prevEnd = previous.x + previous.width;
        const gap = item.x - prevEnd;

        /*
         * 只给疑似英文单词、数字之间补空格。
         * 中文与中文之间不因坐标间距而插入空格。
         */
        const needsSpace =
          !isCJK(prevChar) &&
          !isCJK(nextChar) &&
          isLatinOrDigit(prevChar) &&
          isLatinOrDigit(nextChar) &&
          gap > Math.max(1.5, item.fontSize * 0.15);

        if (needsSpace && !/\s$/.test(result)) {
          result += " ";
        }
      }

      result += text;
      previous = item;
    }

    return result.replace(/[ \t]+/g, " ").trim();
  }

  return lines.map(line =>
    joinItems(line.items)
  ).filter(Boolean).join("\n");
}

async function extractPDF(file, fileIndex) {
  const pdf = await pdfjsLib.getDocument({
    data: await file.arrayBuffer()
  }).promise;

  const pages = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    status(`正在提取 ${file.name}：第 ${p}/${pdf.numPages} 页`);

    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    pages.push(extractLines(content.items));

    progress(60 * (fileIndex + p / pdf.numPages) / files.length);

    if (p % 8 === 0) {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }

  /*
   * 页面之间先用单换行连接，避免每一页都被强制当作新段落。
   * cleanText 会负责合并普通行，并保留提取到的空行分隔。
   */
  return {
    name: file.name.replace(/\.pdf$/i, ""),
    pageCount: pdf.numPages,
    text: cleanText(pages.join("\n"))
  };
}

/* 章节标题识别规则 */
const headingPattern =
  /^(chapter|chapter\s+[\w.-]+|chap(?:ter)?\.?\s*[\w.-]+|第[0-9一二三四五六七八九十百零〇两]+[章节卷部篇回].*|序章|序言|前言|楔子|尾声|后记|番外(?:篇)?(?:\s*\d*)?|prologue|epilogue|preface|afterword|interlude)(?:\s*[:：\-—].*)?$/i;

function splitHeadings(text, fallbackTitle) {
  const lines = text.split(/\n/);
  const chapters = [];
  let title = fallbackTitle;
  let buffer = [];

  for (const line of lines) {
    const t = line.trim();

    const isHeading =
      t.length > 0 &&
      t.length <= 90 &&
      headingPattern.test(t);

    if (isHeading && buffer.join("\n").trim().length > 80) {
      const body = buffer.join("\n").trim();

      if (body) chapters.push({ title, text: body });

      title = t;
      buffer = [];
    }

    buffer.push(line);
  }

  const last = buffer.join("\n").trim();

  if (last) {
    chapters.push({ title, text: last });
  }

  return chapters;
}

function makeChapters(documents) {
  const keepFiles = $("keepFiles").checked;
  const detect = $("detect").checked;
  let chapters = [];

  if (keepFiles) {
    for (const doc of documents) {
      if (detect) {
        const parts = splitHeadings(doc.text, doc.name);

        if (parts.length > 1) {
          parts.forEach((part, i) => {
            if (i === 0 && part.title === doc.name) {
              part.title = doc.name + " — 正文";
            }

            chapters.push(part);
          });
        } else {
          chapters.push({
            title: doc.name,
            text: doc.text
          });
        }
      } else {
        chapters.push({
          title: doc.name,
          text: doc.text
        });
      }
    }
  } else {
    const merged = documents
      .map(doc => doc.text)
      .join("\n\n");

    chapters = detect
      ? splitHeadings(merged, "正文")
      : [{ title: "正文", text: merged }];
  }

  return chapters.filter(ch => ch.text.trim());
}

/* 将正文段落转换为 XHTML */
function paragraphs(text) {
  return text.split(/\n{2,}/)
    .map(block => {
      const content = escapeHTML(block.trim())
        .replace(/\n/g, "<br/>");

      return "<p>" + content + "</p>";
    })
    .join("\n");
}

function xhtml(title, body) {
  return `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh">
<head>
<title>${escapeHTML(title)}</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h1>${escapeHTML(title)}</h1>
${body}
</body>
</html>`;
}

$("start").addEventListener("click", async () => {
  if (!files.length) return;

  if (!window.pdfjsLib || !window.JSZip) {
    say("库加载失败。请检查网络连接并刷新页面。");
    return;
  }

  $("start").disabled = true;
  $("files").disabled = true;
  progress(0);

  try {
    const documents = [];
    const report = [];

    for (let i = 0; i < files.length; i++) {
      const doc = await extractPDF(files[i], i);

      documents.push(doc);

      report.push(
        `${doc.name}: ${doc.pageCount} 页，${doc.text.length} 个字符`
      );

      if (doc.text.length < 100) {
        report.push(
          "  警告：提取文字很少，可能是扫描版或字体编码异常。"
        );
      }
    }

    const chapters = makeChapters(documents);

    if (!chapters.length) {
      throw new Error(
        "没有提取到可用正文，请检查 PDF 是否包含文字层。"
      );
    }

    const title = $("title").value.trim() || "PDF 合集";
    const author = $("author").value.trim() || "未知作者";
    const zip = new JSZip();

    // EPUB 规范要求 mimetype 是第一个文件且不压缩
    zip.file("mimetype", "application/epub+zip", {
      compression: "STORE"
    });

    zip.file(
      "META-INF/container.xml",
      `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0"
 xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
<rootfiles>
<rootfile full-path="OEBPS/content.opf"
 media-type="application/oebps-package+xml"/>
</rootfiles>
</container>`
    );

    let manifest = "";
    let spine = "";
    let toc = "<ol>";

    chapters.forEach((chapter, i) => {
      const id = `ch${i + 1}`;
      const href = `chapter${i + 1}.xhtml`;

      manifest +=
        `<item id="${id}" href="${href}" media-type="application/xhtml+xml"/>`;

      spine += `<itemref idref="${id}"/>`;

      toc +=
        `<li><a href="${href}">${escapeHTML(chapter.title)}</a></li>`;

      zip.file(
        `OEBPS/${href}`,
        xhtml(chapter.title, paragraphs(chapter.text))
      );
    });

    toc += "</ol>";

    zip.file(
      "OEBPS/nav.xhtml",
      `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
 xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh">
<head><title>目录</title></head>
<body>
<nav epub:type="toc" id="toc">
<h1>目录</h1>
${toc}
</nav>
</body>
</html>`
    );

    zip.file(
      "OEBPS/style.css",
      "body{font-family:serif;line-height:1.8;margin:5%;}" +
      "h1{text-align:center;font-size:1.4em;margin:1.5em 0;}" +
      "p{text-indent:2em;margin:.6em 0;}"
    );

    const uid = "pdf-epub-" + Date.now();
    const modified = new Date()
      .toISOString()
      .replace(/\.\d{3}Z$/, "Z");

    zip.file(
      "OEBPS/content.opf",
      `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0"
 unique-identifier="uid" xml:lang="zh">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="uid">${uid}</dc:identifier>
<dc:title>${escapeHTML(title)}</dc:title>
<dc:language>zh</dc:language>
<dc:creator>${escapeHTML(author)}</dc:creator>
<meta property="dcterms:modified">${modified}</meta>
</metadata>
<manifest>
<item id="nav" href="nav.xhtml"
 media-type="application/xhtml+xml" properties="nav"/>
${manifest}
<item id="css" href="style.css" media-type="text/css"/>
</manifest>
<spine>${spine}</spine>
</package>`
    );

    status("正在打包 EPUB……");
    progress(75);

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/epub+zip",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    }, meta => {
      progress(75 + meta.percent * 0.25);
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
      (title.replace(/[\\/:*?"<>|]/g, "_") || "book") + ".epub";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);

    status("转换完成");
    progress(100);

    say(
      "转换完成！\n\n" +
      report.join("\n") +
      `\n\n生成章节：${chapters.length}` +
      `\nEPUB 大小：${(blob.size / 1048576).toFixed(2)} MB` +
      "\n\n请检查目录、段落顺序和章节标题。"
    );

  } catch (error) {
    console.error(error);

    status("转换失败");

    say(
      "错误：" + (error.message || String(error)) +
      "\n\n请检查 PDF 是否有文字层，或尝试减少文件数量。"
    );

  } finally {
    $("start").disabled = files.length === 0;
    $("files").disabled = false;
  }
});

})();
</script>
</body>
</html>
